services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: battleship
      POSTGRES_USER: battleship
      POSTGRES_PASSWORD: battleship
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleship -d battleship"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  service-a:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://battleship:battleship@postgres:5432/battleship
      SERVICE_NAME: service-a
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  service-b:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://battleship:battleship@postgres:5432/battleship
      SERVICE_NAME: service-b
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"

volumes:
  postgres_data:
